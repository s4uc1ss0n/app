<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculateur de Mortier</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1 class="saucisson-title">Calculateur de Mortier</h1>
        
        <div class="calculator">
            <div class="input-group">
                <h2>Position du Mortier</h2>
                <div class="input-row">
                    <label for="x1">X:</label>
                    <input type="number" id="x1" step="0.01" placeholder="38.99">
                </div>
                <div class="input-row">
                    <label for="y1">Y:</label>
                    <input type="number" id="y1" step="0.01" placeholder="111.22">
                </div>
            </div>
            
            <div class="input-group">
                <h2>Position de la Cible</h2>
                <div class="input-row">
                    <label for="x2">X:</label>
                    <input type="number" id="x2" step="0.01" placeholder="88.53">
                </div>
                <div class="input-row">
                    <label for="y2">Y:</label>
                    <input type="number" id="y2" step="0.01" placeholder="129.97">
                </div>
            </div>
            
            <button onclick="calculate()">Calculer</button>
            
            <div class="results" id="results"></div>
        </div>
        
        <p><a href="/" style="color: #bb86fc;">← Retour à l'accueil</a></p>
    </div>
    
    <script>
        function calculate() {
            const x1 = parseFloat(document.getElementById('x1').value);
            const y1 = parseFloat(document.getElementById('y1').value);
            const x2 = parseFloat(document.getElementById('x2').value);
            const y2 = parseFloat(document.getElementById('y2').value);
            
            if (isNaN(x1) || isNaN(y1) || isNaN(x2) || isNaN(y2)) {
                document.getElementById('results').innerHTML = '<p style="color: #ff6b6b;">Veuillez saisir toutes les coordonnées.</p>';
                return;
            }
            
            const deltaX = x2 - x1;
            const deltaY = y2 - y1;
            
            // Distance en mètres
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            
            // Azimut en degrés (0° = Nord, 90° = Est)
            const angleRad = Math.atan2(deltaY, deltaX);
            let angleDeg = angleRad * (180 / Math.PI);
            let azimuth = 90 - angleDeg;
            
            // Normaliser l'azimut entre 0° et 360°
            azimuth = (azimuth + 360) % 360;
            
            document.getElementById('results').innerHTML = `
                <h2>Résultats</h2>
                <p><strong>Distance:</strong> ${Math.round(distance)} м</p>
                <p><strong>Azimut:</strong> ${azimuth.toFixed(1)}°</p>
            `;
        }
    </script>
</body>
</html>
